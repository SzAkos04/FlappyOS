name: C/C++ CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TOOLCHAIN_VERSION: "13.2.0"
  TOOLCHAIN_URL: "https://github.com/lordmilko/i686-elf-tools/releases/download/13.2.0/i686-elf-tools-linux.zip"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            make \
            nasm \
            unzip \
            wget \
            qemu-system-x86

      - name: Cache i686-elf toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: ~/i686-elf-tools
          key: i686-elf-tools-${{ env.TOOLCHAIN_VERSION }}

      - name: Download & install i686-elf toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          wget -q "${{ env.TOOLCHAIN_URL }}" \
            -O i686-elf-tools-linux.zip

          unzip -q i686-elf-tools-linux.zip \
            -d "$HOME/i686-elf-tools"

      - name: Add toolchain to PATH
        run: echo "$HOME/i686-elf-tools/bin" >> "$GITHUB_PATH"

      - name: Build
        run: make

      - name: Verify disk image
        run: |
          IMAGE="build/flappyos.img"

          if [ ! -f "$IMAGE" ]; then
            echo "::error::Disk image was not created: $IMAGE"
            exit 1
          fi

          SIZE=$(wc -c < "$IMAGE")

          echo "Disk image: $IMAGE"
          echo "Size: $SIZE bytes"

          if [ "$SIZE" -lt 512 ]; then
            echo "::error::Disk image is smaller than one boot sector"
            exit 1
          fi

          if [ $((SIZE % 512)) -ne 0 ]; then
            echo "::error::Disk image size is not aligned to a 512-byte sector"
            exit 1
          fi

      - name: Verify boot signature
        run: |
          IMAGE="build/flappyos.img"

          SIGNATURE=$(xxd -p -s 510 -l 2 "$IMAGE")

          echo "Boot signature: 0x$SIGNATURE"

          if [ "$SIGNATURE" != "55aa" ]; then
            echo "::error::Invalid boot signature: expected 55aa at offset 510"
            exit 1
          fi

      - name: Smoke test in QEMU
        run: |
          timeout 5s qemu-system-i386 \
            -drive format=raw,file=build/flappyos.img \
            -display none \
            -no-reboot \
            -no-shutdown \
            -d int,cpu_reset \
            -D qemu.log || true

          echo "--- QEMU log ---"
          cat qemu.log || true

          if grep -qi "triple fault\|check_exception" qemu.log 2>/dev/null; then
            echo "::error::Triple fault or unexpected exception detected during boot"
            exit 1
          fi

      - name: Upload disk image
        uses: actions/upload-artifact@v4
        with:
          name: FlappyOS-disk-image
          path: build/flappyos.img
          retention-days: 14
