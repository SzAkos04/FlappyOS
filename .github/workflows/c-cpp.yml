name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TOOLCHAIN_VERSION: "13.2.0"
  TOOLCHAIN_URL: "https://github.com/lordmilko/i686-elf-tools/releases/download/13.2.0/i686-elf-tools-linux.zip"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make nasm unzip wget qemu-system-x86

      - name: Cache i686-elf toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: ~/i686-elf-tools
          key: i686-elf-tools-${{ env.TOOLCHAIN_VERSION }}

      - name: Download & Install i686-elf Toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          wget -q "${{ env.TOOLCHAIN_URL }}" -O i686-elf-tools-linux.zip
          unzip -q i686-elf-tools-linux.zip -d "$HOME/i686-elf-tools"

      - name: Add toolchain to PATH
        run: echo "$HOME/i686-elf-tools/bin" >> "$GITHUB_PATH"

      - name: Build with make
        run: make

      - name: Verify boot image fits on a 1.44MB floppy
        run: |
          SIZE=$(wc -c < build/boot/boot.img)
          LIMIT=1474560
          echo "boot.img size: $SIZE bytes (limit: $LIMIT)"
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "::error::boot.img ($SIZE bytes) exceeds 1.44MB floppy limit ($LIMIT bytes)"
            exit 1
          fi

      - name: Smoke test in QEMU (boot without crashing)
        run: |
          timeout 5s qemu-system-i386 \
            -drive if=floppy,format=raw,file=build/boot/boot.img \
            -display none \
            -no-reboot \
            -d int,cpu_reset -D qemu.log || true
          echo "--- QEMU log (interrupt/reset trace) ---"
          cat qemu.log || true
          if grep -qi "triple fault\|check_exception" qemu.log 2>/dev/null; then
            echo "::error::Triple fault or unexpected exception detected during boot"
            exit 1
          fi

      - name: Upload boot image artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlappyOS-boot-img
          path: build/boot/boot.img
          retention-days: 14
