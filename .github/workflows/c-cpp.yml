name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential make nasm

    - name: Set up i686-elf GCC Toolchain
      uses: lordmancer/setup-i686-elf-gcc@v1

    - name: Build with make
      run: make
